name: Deploy Backend to Staging

on:
  push:
    branches: [ stage ]

env:
  STAGING_BACKEND_HOST: ${{ vars.STAGING_BACKEND_HOST }}
  STAGING_BACKEND_USERNAME: ${{ vars.STAGING_BACKEND_USERNAME }}
  STAGING_BACKEND_PORT: ${{ vars.STAGING_BACKEND_PORT }}
  STAGING_BACKEND_PATH: ${{ vars.STAGING_BACKEND_PATH }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies and build
      run: |
        npm i
        # Create deployment package with node_modules
        tar -czf deployment.tar.gz \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='*.tar.gz' \
          --warning=no-file-changed \
          .


    - name: Copy deployment to server
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ env.STAGING_BACKEND_HOST }}
        username: ${{ env.STAGING_BACKEND_USERNAME }}
        key: ${{ secrets.STAGING_BACKEND_SSH_KEY }}
        port: ${{ env.STAGING_BACKEND_PORT }}
        source: "deployment.tar.gz"
        target: "/tmp/"

    - name: Deploy Backend to Staging Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ env.STAGING_BACKEND_HOST }}
        username: ${{ env.STAGING_BACKEND_USERNAME }}
        key: ${{ secrets.STAGING_BACKEND_SSH_KEY }}
        port: ${{ env.STAGING_BACKEND_PORT }}
        script: |
          echo "Starting backend deployment to staging..."

          # Navigate to backend directory
          cd ${{ env.STAGING_BACKEND_PATH }}

          # Extract the pre-built deployment
          echo "Extracting pre-built deployment..."
          tar -xzf /tmp/deployment.tar.gz -C .
          rm /tmp/deployment.tar.gz

          # Stop existing PM2 processes (matching Jenkins script exactly)
          pm2 delete all

          # Start the application
          pm2 start app.js

          # Restart web server
          sudo systemctl restart httpd

          echo "Backend staging deployment completed successfully!"

    - name: Notify deployment status
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ Backend staging deployment completed successfully!"
        else
          echo "❌ Backend staging deployment failed!"
        fi
